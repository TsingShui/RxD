name: Arxd PoC

on:
  pull_request:
    paths:
      - 'apps/arxd/**'
      - 'third_party/termux-exec/**'
      - '!apps/arxd/README.md'
      - '!apps/arxd/AGENTS.md'
      - '.github/workflows/arxd.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'src/main.rs'
      - 'src/cli/js/**'
      - 'crates/rxd-js/**'
      - 'crates/rxd-core/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Prepare the shared CLI seam
        run: |
          git submodule update --init third_party/kuna
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 build --locked --release -p rxd --no-default-features --features backend-js
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: apps/arxd/package-lock.json
      - name: Install Node and the pinned application dependencies
        working-directory: apps/arxd
        run: |
          npm ci --ignore-scripts
      - name: Verify application contracts
        working-directory: apps/arxd
        run: |
          npm run typecheck
          npm run lint
          npm test
          npx expo export --platform android --output-dir ../../target/arxd/bundle
