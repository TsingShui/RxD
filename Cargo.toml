[package]
name = "rxd"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Agent-oriented JVM, .NET IL, APK/DEX, EVM, WASM and PYC analysis CLI with ASAR/ZIP/PyInstaller unpacking"
license = "Apache-2.0"
publish = false

[workspace]
members = [
    "crates/rxd-core",
    "crates/rxd-abc",
    "crates/rxd-asar",
    "crates/rxd-zip",
    "crates/rxd-dex",
    "crates/rxd-jvm",
    "crates/rxd-dotnet",
    "crates/rxd-kuna-cli",
    "crates/rxd-wasm",
    "crates/rxd-evm",
    "crates/rxd-pyc",
    "crates/rxd-lua",
    "crates/rxd-flutter",
    "crates/rxd-pyinstaller",
    "crates/rxd-wxapkg",
    "third_party/radguard",
]
exclude = ["third_party/axmldecoder", "third_party/pycdc", "third_party/kuna", "third_party/dae"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
rxd-core = { path = "crates/rxd-core" }
rxd-abc = { path = "crates/rxd-abc" }
rxd-asar = { path = "crates/rxd-asar" }
rxd-zip = { path = "crates/rxd-zip" }
rxd-pyc = { path = "crates/rxd-pyc" }
rxd-lua = { path = "crates/rxd-lua" }
rxd-flutter = { path = "crates/rxd-flutter" }
rxd-pyinstaller = { path = "crates/rxd-pyinstaller" }
rxd-wxapkg = { path = "crates/rxd-wxapkg" }

[features]
default = ["all-feature"]
all-feature = ["all-backends", "mcp"]
all-backends = [
    "unpack",
    "backend-abc",
    "backend-dex",
    "backend-jvm",
    "backend-dotnet",
    "backend-evm",
    "backend-wasm",
    "backend-pyc",
    "backend-lua",
    "backend-flutter",
    "backend-kuna",
]
backend-abc = ["dep:rxd-abc"]
backend-asar = ["dep:rxd-asar"]
backend-zip = ["dep:rxd-zip"]
unpack = ["backend-asar", "backend-zip", "dep:rxd-pyinstaller", "dep:rxd-wxapkg"]
backend-dex = ["dep:rxd-dex", "dep:rayon", "dep:sha2"]
backend-jvm = ["dep:rxd-jvm"]
backend-dotnet = ["dep:rxd-dotnet"]
backend-evm = ["dep:rxd-evm"]
backend-wasm = ["dep:rxd-wasm"]
backend-pyc = ["dep:rxd-pyc"]
backend-lua = ["dep:rxd-lua"]
backend-flutter = ["dep:rxd-flutter"]
backend-kuna = []
mcp = ["dep:rmcp", "dep:tokio", "dep:tokio-util", "dep:schemars", "dep:sha2", "dep:base64", "dep:rayon", "dep:windows-sys"]
csharp-decompiler = ["backend-dotnet", "rxd-dotnet/csharp-decompiler"]
bundled-kuna = ["backend-kuna", "rxd-core/runtime-bundle", "dep:rxd-kuna-cli"]
bundled-ilspy = ["backend-dotnet", "csharp-decompiler", "rxd-dotnet/bundled-ilspy"]

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"], optional = true }
tokio = { version = "=1.53.2", features = ["rt-multi-thread", "io-std", "io-util", "sync", "process", "time", "signal"], optional = true }
tokio-util = { version = "0.7", optional = true }
schemars = { version = "=1.2.3", optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rxd-kuna-cli = { path = "crates/rxd-kuna-cli", optional = true }
anyhow = "1.0"
rayon = { version = "1.12", optional = true }
rxd-dex = { path = "crates/rxd-dex", optional = true }
rxd-jvm = { path = "crates/rxd-jvm", optional = true }
rxd-dotnet = { path = "crates/rxd-dotnet", optional = true }
rxd-wasm = { path = "crates/rxd-wasm", optional = true }
rxd-evm = { path = "crates/rxd-evm", optional = true }
clap = { version = "4.6", features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tempfile = "3.27"
rxd-core.workspace = true
rxd-abc = { workspace = true, optional = true }
rxd-asar = { workspace = true, optional = true }
rxd-zip = { workspace = true, optional = true }
rxd-pyinstaller = { workspace = true, optional = true }
rxd-wxapkg = { workspace = true, optional = true }
rxd-pyc = { workspace = true, optional = true }
rxd-lua = { workspace = true, optional = true }
rxd-flutter = { workspace = true, optional = true }

[dev-dependencies]
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[patch.crates-io]
axmldecoder = { path = "third_party/axmldecoder" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"], optional = true }
