[package]
name = "rxd-hook-gen"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false
description = "Offline, bounded Frida and Web hook source generation"

[features]
default = ["web"]
web = []
dex = ["dep:rxd-dex"]
native = ["dep:object"]
kuna = ["native", "dep:rxd-kuna-cli"]

[dependencies]
rxd-core.workspace = true
serde.workspace = true
serde_json.workspace = true
rxd-dex = { path = "../rxd-dex", optional = true }
rxd-kuna-cli = { path = "../rxd-kuna-cli", optional = true }
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "pe", "macho", "coff", "std", "archive"], optional = true }
sha2 = "0.11"
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
clap = { version = "4.6", features = ["derive"] }
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
