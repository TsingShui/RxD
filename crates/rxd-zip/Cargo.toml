[package]
name = "rxd-zip"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
rxd-core.workspace = true
serde_json.workspace = true
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }
libdeflater = "1.26"
crc32fast = "1"
rayon = "1.12"

[dev-dependencies]
tempfile = "3.27"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
