[package]
name = "rxd-dotnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[features]
csharp-decompiler = ["dep:libloading"]
bundled-ilspy = ["csharp-decompiler", "rxd-core/runtime-bundle"]

[dependencies]
rxd-core.workspace = true
libloading = { version = "0.9", optional = true }
anyhow = "1.0"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2 = "0.11"
strum = "0.28"
dotscope = { git = "https://github.com/ATRAPSLLC/dotscope", rev = "3028b1ab92ec1b0ad15f046b3b70d5ee82336a00", default-features = false }

[build-dependencies]
serde_json.workspace = true
sha2 = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
