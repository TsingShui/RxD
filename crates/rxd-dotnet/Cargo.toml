[package]
name = "rxd-dotnet"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
publish = false

[features]
csharp-decompiler = ["dep:libloading"]
bundled-ilspy = ["csharp-decompiler", "rxd-core/runtime-bundle"]

[dependencies]
rxd-core.workspace = true
libloading = { version = "0.9", optional = true }
anyhow = "1.0"
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
sha2 = "0.11"
strum = "0.28"
cildec = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
