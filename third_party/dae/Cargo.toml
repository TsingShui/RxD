[package]
edition = "2021"
name = "dae-rs"
version = "0.1.14"
authors = ["ejfkdev"]
build = "build.rs"
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Dart AOT snapshot analyzer: blutter-compatible symbols for IDA/radare2/Frida, plus a decompiler emitting dart-analyze-clean Dart. Desktop and mobile (compressed pointers)."
readme = "README.md"
keywords = [
    "dart",
    "aot",
    "snapshot",
    "reverse-engineering",
    "blutter",
]
categories = [
    "command-line-utilities",
    "development-tools::debugging",
]
license = "MIT"
repository = "https://github.com/ejfkdev/dae"

[features]
