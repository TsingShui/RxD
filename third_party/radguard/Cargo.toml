[package]
name = "radguard"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
publish = false
# The fork's own tests are kept for reference but are not part of any workspace
# or CI run; rxd's suites are the ones that gate this crate.
autotests = false

[lib]
name = "radguard"
path = "src/lib.rs"

# The library has no dependencies. The command-line shell, the APK pipeline and
# the C decompression backend are not vendored: rxd drives the library directly.
[dependencies]
